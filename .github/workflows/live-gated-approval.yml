name: live-gated-approval
# Throwaway live check of gated auto-approval (#4855) on the IsmaelMartinez/pr-agent fork only.
on:
  pull_request:
    branches: [live-test/base]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - run: echo "stand-in CI check on the reviewed head"

  live:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Run live scenarios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: PYTHONPATH=. uv run --frozen python .github/live/live_gated_approval.py
